# Dependabot version updates: раз в неделю — по одному PR на экосистему со всеми обновлениями сразу,
# а не поток мелких PR. Каждый такой PR проходит CI, вливает владелец (docs/ARCHITECTURE.md, раздел 11).
#
# Зачем: уязвимости в инструментах сборки (плагины Android и Kotlin, Ktor, ktlint) исправляются только
# обновлением самих инструментов, а граф зависимостей для Dependabot их намеренно не включает
# (.github/workflows/dependency-graph.yml). Dependabot security updates в настройках репозитория выключены.
#
# cooldown: новая версия предлагается не раньше чем через 7 дней после выхода. За это время находят
# большинство сломанных и вредоносных выпусков (атаки через подмену пакетов npm). На предупреждения
# об уязвимостях это не влияет.
version: 2
updates:
  # Gradle: версии в gradle/libs.versions.toml (version catalog) и Gradle Wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns: ["*"]

  # Веб-приложение (web/package.json).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 пока не поддерживает typescript-eslint — отложенная задача этапа 5
      # в docs/ARCHITECTURE.md. Когда поддержка появится, уберите это исключение.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Действия в .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
