# Проверки на каждый PR и push в main: тесты и линтеры всех частей проекта.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-shared:
    name: Backend и shared (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :backend:ktlintCheck :shared:ktlintCheck :backend:test :shared:jvmTest

  android:
    name: Android (lint, unit-тесты, доступность)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :android:app:ktlintCheck :android:app:lintDebug :android:app:testDebugUnitTest

  shared-ios:
    name: shared под iOS (без Android-кода)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:compileKotlinIosArm64 :shared:iosSimulatorArm64Test

  openapi:
    name: Контракт API (openapi.yaml)
    runs-on: ubuntu-latest
    env:
      # Не отправлять статистику использования Redocly и не проверять обновления.
      REDOCLY_TELEMETRY: "off"
      REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      # Правила — в redocly.yaml, исключения — в .redocly.lint-ignore.yaml. Версию меняйте и в README.
      - run: npx --yes @redocly/cli@2.54.3 lint

  web:
    name: Web (lint, типы, тесты, сборка)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
