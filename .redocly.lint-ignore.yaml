# Осознанные исключения из правил проверки контракта (Redocly CLI, настройки — redocly.yaml).
# Каждое исключение — одно конкретное место в openapi.yaml; правило для остальных мест продолжает работать.
docs/api/openapi.yaml:
  # /health только сообщает, что сервер жив: ошибок 4xx у него не бывает.
  operation-4xx-response:
    - '#/paths/~1health/get/responses'
  # /ws открывает WebSocket: успешный ответ — 101 Switching Protocols, а не 2xx.
  operation-2xx-response:
    - '#/paths/~1ws/get/responses'
  # Сообщение клиента в WebSocket указано в расширении x-client-message операции /ws:
  # ссылки из расширений Redocly не считает использованием.
  no-unused-components:
    - '#/components/schemas/RealtimeClientMessage'
    # Содержимое push-уведомления указано в расширении x-push-message операции POST /devices.
    - '#/components/schemas/PushMessage'
