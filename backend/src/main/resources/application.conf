# Настройки backend (формат HOCON). Строка `ключ = ${?ПЕРЕМЕННАЯ}` означает:
# если переменная окружения задана, она заменяет значение по умолчанию.
# Секреты задаются только переменными окружения (локально — в infra/.env, см. .env.example).

server {
  port = 8080
  port = ${?PORT}
}

database {
  # Имя базы — то же, что создаёт docker-compose (POSTGRES_DB).
  name = "ryadom"
  name = ${?POSTGRES_DB}
  url = "jdbc:postgresql://localhost:5432/"${database.name}
  # На сервере адрес базы задаётся целиком.
  url = ${?DATABASE_URL}
  user = "ryadom"
  user = ${?POSTGRES_USER}
  # Обязателен, значения по умолчанию нет.
  password = ${?POSTGRES_PASSWORD}
  maxPoolSize = 10
}

auth {
  jwt {
    # Обязателен, не короче 32 символов. Сгенерировать: openssl rand -hex 32
    secret = ${?JWT_SECRET}
    issuer = "ryadom"
    audience = "ryadom-api"
    accessTokenTtl = 15m
  }

  # Сколько живёт refresh-токен. Каждое обновление выдаёт новый токен с новым сроком,
  # поэтому пользователь, который заходит хотя бы раз в этот срок, не разлогинивается.
  refreshTokenTtl = 90d

  # Вход без OAuth (POST /auth/dev). Только для локальной разработки и тестов, никогда на боевом сервере.
  devLoginEnabled = false
  devLoginEnabled = ${?AUTH_DEV_ENABLED}

  # Яндекс ID. Приложение регистрируется на https://oauth.yandex.ru с доступом login:info
  # (логин, имя, пол); из этих данных сервер сохраняет только имя.
  # Пустой clientId — вход через Яндекс выключен (POST /auth/oauth/yandex отвечает 404).
  yandex {
    clientId = ""
    clientId = ${?YANDEX_CLIENT_ID}
    clientSecret = ""
    clientSecret = ${?YANDEX_CLIENT_SECRET}
    # Дополнительные client_id через запятую, токенам которых тоже доверяем
    # (если у Android-приложения отдельная регистрация в Яндекс ID).
    extraClientIds = ""
    extraClientIds = ${?YANDEX_EXTRA_CLIENT_IDS}
    oauthUrl = "https://oauth.yandex.ru"
    loginUrl = "https://login.yandex.ru"
  }
}

# Значения профиля для новых пользователей.
profile {
  defaultLanguage = "ru"
  defaultTimezone = "Europe/Moscow"
  # Окно «не беспокоить», если пользователь не задал своё (по его местному времени):
  # в это время волонтёру не приходят вызовы.
  defaultDoNotDisturb {
    from = "22:00"
    to = "08:00"
  }
}

# Подбор волонтёров (docs/ARCHITECTURE.md, раздел 4). Окно «не беспокоить» по умолчанию — выше, в profile.
# Жёсткой паузы между вызовами одному волонтёру нет: первыми зовут тех, кого дольше всего не беспокоили,
# а недавно побеспокоенных — только если остальных не хватает на волну.
matching {
  # Сколько волонтёров уведомляется сразу после запроса.
  firstWaveSize = 5
  # Сколько волонтёров добавляется в каждой следующей волне.
  nextWaveSize = 10
  # Пауза между волнами.
  waveInterval = 10s
  # Сколько длится поиск. Если за это время никто не принял запрос — статус no_answer.
  searchTimeout = 60s
  # Как часто сервер проверяет, не пора ли отправить следующую волну или закрыть поиск.
  checkInterval = 1s
}

requests {
  # Защита от злоупотреблений: не больше maxRequests запросов от одного пользователя за window.
  rateLimit {
    maxRequests = 20
    window = 1h
  }
  # Страховка: звонок, о завершении которого LiveKit не сообщил, закрывается через это время.
  maxCallDuration = 3h
}

# WebSocket событий (/ws).
realtime {
  # Сколько ждать сообщения auth после открытия соединения.
  authTimeout = 10s
  # Как часто проверять, что соединение живо (ping); пропавшие клиенты отключаются.
  pingInterval = 30s
}

# LiveKit — сервер видеозвонков (infra/docker-compose.yml). Видео и звук идут через него, а не через backend.
livekit {
  # Адрес LiveKit, который получают клиенты. Для телефона или эмулятора Android укажите адрес
  # компьютера в локальной сети (см. infra/.env.example).
  url = "ws://localhost:7880"
  url = ${?LIVEKIT_URL}
  # Обязательны: те же ключ и секрет, что у сервера LiveKit (секрет — не короче 32 символов).
  apiKey = ${?LIVEKIT_API_KEY}
  apiSecret = ${?LIVEKIT_API_SECRET}
  # Сколько живёт токен для входа в комнату (не больше 2 часов). Уже начатый звонок по истечении не прерывается.
  tokenTtl = 2h
}
