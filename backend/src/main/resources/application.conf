# Настройки backend (формат HOCON). Строка `ключ = ${?ПЕРЕМЕННАЯ}` означает:
# если переменная окружения задана, она заменяет значение по умолчанию.
# Секреты задаются только переменными окружения (локально — в infra/.env, см. .env.example).

server {
  port = 8080
  port = ${?PORT}
}

database {
  # Имя базы — то же, что создаёт docker-compose (POSTGRES_DB).
  name = "ryadom"
  name = ${?POSTGRES_DB}
  url = "jdbc:postgresql://localhost:5432/"${database.name}
  # На сервере адрес базы задаётся целиком.
  url = ${?DATABASE_URL}
  user = "ryadom"
  user = ${?POSTGRES_USER}
  # Обязателен, значения по умолчанию нет.
  password = ${?POSTGRES_PASSWORD}
  maxPoolSize = 10
}

auth {
  jwt {
    # Обязателен, не короче 32 символов. Сгенерировать: openssl rand -hex 32
    secret = ${?JWT_SECRET}
    issuer = "ryadom"
    audience = "ryadom-api"
    accessTokenTtl = 15m
  }

  # Сколько живёт refresh-токен. Каждое обновление выдаёт новый токен с новым сроком,
  # поэтому пользователь, который заходит хотя бы раз в этот срок, не разлогинивается.
  refreshTokenTtl = 90d

  # Вход без OAuth (POST /auth/dev). Только для локальной разработки и тестов, никогда на боевом сервере.
  devLoginEnabled = false
  devLoginEnabled = ${?AUTH_DEV_ENABLED}

  # Яндекс ID. Приложение регистрируется на https://oauth.yandex.ru с доступом login:info
  # (логин, имя, пол); из этих данных сервер сохраняет только имя.
  # Пустой clientId — вход через Яндекс выключен (POST /auth/oauth/yandex отвечает 404).
  yandex {
    clientId = ""
    clientId = ${?YANDEX_CLIENT_ID}
    clientSecret = ""
    clientSecret = ${?YANDEX_CLIENT_SECRET}
    # Дополнительные client_id через запятую, токенам которых тоже доверяем
    # (если у Android-приложения отдельная регистрация в Яндекс ID).
    extraClientIds = ""
    extraClientIds = ${?YANDEX_EXTRA_CLIENT_IDS}
    oauthUrl = "https://oauth.yandex.ru"
    loginUrl = "https://login.yandex.ru"
  }
}

# Значения профиля для новых пользователей.
profile {
  defaultLanguage = "ru"
  defaultTimezone = "Europe/Moscow"
  # Окно «не беспокоить», если пользователь не задал своё (по его местному времени).
  # Используется при подборе волонтёров (этап 2).
  defaultDoNotDisturb {
    from = "22:00"
    to = "08:00"
  }
}
