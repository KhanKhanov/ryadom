# Локальное окружение для разработки: PostgreSQL и LiveKit.
# Запуск: скопируйте infra/.env.example в infra/.env, заполните значения и выполните
#   docker compose -f infra/docker-compose.yml up
# Backend запускается отдельно: ./gradlew :backend:run (см. README).
# Redis пока не нужен: сервер backend один (docs/ARCHITECTURE.md, раздел 1).
name: ryadom

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ryadom}
      POSTGRES_USER: ${POSTGRES_USER:-ryadom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # Формат "ключ: секрет". Ключи не хранятся в репозитории — только в infra/.env.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Задайте LIVEKIT_API_KEY в infra/.env}: ${LIVEKIT_API_SECRET:?Задайте LIVEKIT_API_SECRET в infra/.env}"
      # Адрес, который LiveKit сообщает клиентам для видео. Без него он отдаёт внутренний IP
      # контейнера (172.x), недоступный ни браузеру, ни телефону. Подробности — в infra/.env.example.
      NODE_IP: ${LIVEKIT_NODE_IP:-127.0.0.1}
      # Каким ключом API подписывать события для backend (webhook в livekit.yaml).
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_API_KEY}
    # Чтобы адрес host.docker.internal (backend на этом компьютере) работал и в Linux, а не только в Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880" # HTTP/WebSocket сигнализация
      - "7881:7881" # WebRTC по TCP (запасной путь)
      - "50000-50100:50000-50100/udp" # WebRTC по UDP

volumes:
  postgres-data:
