# Локальное окружение для разработки: PostgreSQL, Redis, LiveKit.
# Запуск: скопируйте infra/.env.example в infra/.env, заполните значения и выполните
#   docker compose -f infra/docker-compose.yml up
# Backend запускается отдельно: ./gradlew :backend:run (см. README).
name: ryadom

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ryadom}
      POSTGRES_USER: ${POSTGRES_USER:-ryadom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # Формат "ключ: секрет". Ключи не хранятся в репозитории — только в infra/.env.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Задайте LIVEKIT_API_KEY в infra/.env}: ${LIVEKIT_API_SECRET:?Задайте LIVEKIT_API_SECRET в infra/.env}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880" # HTTP/WebSocket сигнализация
      - "7881:7881" # WebRTC по TCP (запасной путь)
      - "50000-50100:50000-50100/udp" # WebRTC по UDP

volumes:
  postgres-data:
