# Конфигурация LiveKit для локальной разработки.
# Ключи API передаются через переменную окружения LIVEKIT_KEYS (см. docker-compose.yml).
# Звонки не записываются: модуль Egress не подключается.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Локально адрес для клиентов задаёт переменная NODE_IP (см. docker-compose.yml);
  # на сервере (этап 9) включается use_external_ip.
  use_external_ip: false
# События комнат (участник вошёл, комната закрыта) — в backend: по ним он узнаёт, что звонок начался и закончился.
# Ключ, которым LiveKit подписывает события, задаёт переменная LIVEKIT_WEBHOOK_API_KEY (см. docker-compose.yml).
webhook:
  urls:
    # Backend, запущенный на этом компьютере (./gradlew :backend:run).
    - http://host.docker.internal:8080/webhooks/livekit
logging:
  level: info
